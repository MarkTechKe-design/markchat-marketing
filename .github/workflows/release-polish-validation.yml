name: P0 P1 release polish validation

on:
  push:
    branches: [release/p0-p1-screwfast-polish]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://markchat.co.ke
      PUBLIC_CONTROL_PLANE_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format changed sources
        run: npm run format
      - name: Verify source, build and regression suite
        run: npm run check && npm run build && npm test
      - name: Commit validated formatting to release branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(release): apply verified Prettier formatting"
            git push origin HEAD:release/p0-p1-screwfast-polish
          fi
