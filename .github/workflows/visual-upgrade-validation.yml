name: Visual upgrade branch validation

on:
  push:
    branches: [feat/royal-blue-motion-navigation]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://markchat.co.ke
      PUBLIC_CONTROL_PLANE_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Format modified source and test files
        run: |
          git diff --name-only -z origin/main...HEAD -- '*.astro' '*.ts' '*.mjs' '*.yml' |
            xargs -0 -r npx prettier --write
      - name: Lint, formatting and Astro diagnostics
        run: npm run check
      - name: Build production static routes
        run: npm run build
      - name: Run all existing and new tests
        run: npm test
      - name: Persist formatting after successful validation
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(marketing): format verified visual upgrade"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
